[project]
name = "wujian-foundation"
version = "0.3.0"
description = "Wujian local web application with a shared domain and Bailian AgentScope runtime"
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.11",
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "pillow>=11,<13",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic==2.14.2",
    "pypdf>=5,<7",
    "pypdfium2>=4,<6",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20",
    "reme-ai==0.4.2.1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
video = ["yt-dlp==2026.10.26"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wujian"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
