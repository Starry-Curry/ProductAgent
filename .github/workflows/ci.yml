name: Wujian offline checks

on:
  push:
    branches: [main, develop, feat/as2-adaptive-lessons]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DASHSCOPE_API_KEY: ""
  WUJIAN_REA_ENABLED: "false"
  WUJIAN_DEMO_MODE: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the verified uv version and locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen
      - name: Offline engineering regression
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Development fixture contract
        run: uv run --frozen python -m wujian validate fixtures/development/catalog.json
      - name: Check generated OpenAPI
        run: |
          uv run --frozen python -m wujian openapi contracts/openapi.json
          git diff --exit-code -- contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Check generated frontend types
        run: |
          npm --prefix frontend run types
          git diff --exit-code -- frontend/src/generated/api.ts
      - name: Typecheck and production build
        run: npm --prefix frontend run build
